name: Supabase Keepalive

# Public repositories: GitHub may disable scheduled workflows after 60 days
# without repository activity. Check the Actions page periodically.
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
"on":
  schedule:
    # UTC 01:17, 09:17, 17:17 = KST 10:17, 18:17, 02:17.
    # Avoid the start of the hour, when scheduled Actions can be delayed.
    - cron: "17 1,9,17 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/supabase-keepalive.yml

# This job needs no repository token permissions or application secrets.
permissions: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  check-database:
    name: Check Supabase through the deployed application
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      # No checkout, build, upload, deployment, or local-machine runner.
      - name: Request a fresh database readiness check
        shell: bash
        env:
          READINESS_URL: https://lerny-ten.vercel.app/api/v1/health/ready
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          for attempt in range(1, 4):
              try:
                  url = os.environ["READINESS_URL"] + "?keepalive=" + str(time.time_ns())
                  request = urllib.request.Request(
                      url,
                      headers={
                          "Accept": "application/json",
                          "Cache-Control": "no-cache",
                          "User-Agent": "Lerny-Supabase-Keepalive/1.0",
                      },
                  )
                  with opener.open(request, timeout=45) as response:
                      if response.status != 200:
                          raise ValueError("Unexpected HTTP status")
                      raw = response.read(16385)
                      if len(raw) > 16384:
                          raise ValueError("Unexpected response size")
                      result = json.loads(raw)
                  if (
                      result.get("status") != "ready"
                      or result.get("scope") != "general_service"
                      or result.get("dependencies", {}).get("database") != "ready"
                      or result.get("dependencies", {}).get("storage") != "ready"
                  ):
                      raise ValueError("Cloud dependencies are not ready")
                  # Log status only, never response bodies or credentials.
                  print(f"Attempt {attempt}: HTTP 200; database ready; storage ready.")
                  sys.exit(0)
              except (
                  urllib.error.URLError,
                  TimeoutError,
                  ValueError,
                  AttributeError,
                  TypeError,
              ) as error:
                  print(f"Attempt {attempt}: readiness check failed ({type(error).__name__}).")
                  if attempt < 3:
                      time.sleep(10)
          print("Cloud readiness check failed after three attempts.")
          sys.exit(1)
          PY
